# Render Blueprint — free-tier deploy of the Job Agent backend + React frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets (sync: false) must be set once in the Render dashboard.
# They are NOT wiped on Blueprint resyncs for static sites, and the backend
# service is the only one that needs manual entry after each resync.
# To avoid that, link the "job-agent-secrets" Environment Group to the
# backend service manually in the Render dashboard after first deploy.

services:
  - type: web
    name: job-agent-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: USE_STAGEHAND
        value: "false"
      - key: SUPABASE_URL
        value: https://mkokkgtjyanotnctguqe.supabase.co
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: job-agent-frontend
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://mkokkgtjyanotnctguqe.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        value: https://job-agent-backend-jg3v.onrender.com
