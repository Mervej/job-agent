# Render Blueprint — free-tier deploy of the Job Agent backend + React frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# After pushing this repo to GitHub:
#   Render Dashboard → New → Blueprint → pick this repo → Apply.
# Render reads this file and provisions the service. You'll be prompted for
# the secret env vars marked `sync: false`.

services:
  - type: web
    name: job-agent-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && cd web && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: USE_STAGEHAND
        value: "false"
      - key: SUPABASE_URL
        value: https://mkokkgtjyanotnctguqe.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://mkokkgtjyanotnctguqe.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
