# Render Blueprint — free-tier deploy of the Job Agent backend + React frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# After pushing this repo to GitHub:
#   Render Dashboard → New → Blueprint → pick this repo → Apply.
#
# Secrets are stored in an Environment Group called "job-agent-secrets" so they
# survive Blueprint resyncs. Create the group in:
#   Render Dashboard → Account Settings → Environment Groups → New
# Add these keys there: GROQ_API_KEY, SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, VITE_SUPABASE_ANON_KEY

services:
  - type: web
    name: job-agent-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && cd web && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVarGroups:
      - job-agent-secrets
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: USE_STAGEHAND
        value: "false"
      - key: SUPABASE_URL
        value: https://mkokkgtjyanotnctguqe.supabase.co
      - key: VITE_SUPABASE_URL
        value: https://mkokkgtjyanotnctguqe.supabase.co
